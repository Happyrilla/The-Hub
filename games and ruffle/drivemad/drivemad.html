<!DOCTYPE html>
<html>
<head>
    <title>Drive Mad</title>
    <link rel="icon" href="drivemad.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/19b444568b.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url('./drivemad background.png');
        }
    </style>
    <script>
if (!location.hostname.endsWith("github.io")) {
  var s = document.createElement("script");
  s.defer = true;
  s.src = "../../_vercel/insights/script.js";
  document.head.appendChild(s);
}
</script>
</head>

<body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh;">
    <a href="../../sub-sites/games.html" style="position: absolute; top: 5%; left: 1%; text-decoration: none; border: none; font-size: 40px; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-left-long"></i> back
    </a>
    <iframe id="gameFrame" src="./drivemad2.html" frameborder="0" tabindex="0" allow="fullscreen" style="position: absolute; width: 1130px; height: 580px; left: 55%; top: 50%; transform: translate(-50%, -50%);"></iframe>
    <button onclick="window.location.href = './drivemad1.html'" style="position: absolute; left: 6%; top: 94%; transform: translate(-50%, -50%);">Play drivemad 1?</button>

    <script>
      const gameFrame = document.getElementById("gameFrame");

      function focusGameFrame() {
        gameFrame.focus({ preventScroll: true });
      }

      gameFrame.addEventListener("click", focusGameFrame);
      gameFrame.addEventListener("mouseenter", focusGameFrame);
      gameFrame.addEventListener("mousedown", focusGameFrame);

      window.addEventListener("load", () => {
        setTimeout(focusGameFrame, 250);
      });
    </script>
</body>
</html>
