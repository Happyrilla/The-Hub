    <style>
       body {
            background-image: url('../assets/links.png');
            background-color: rgba(76, 20, 2, 0.25);
            background-blend-mode: multiply;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            }

    <script>
if (!location.hostname.endsWith("github.io")) {
  var s = document.createElement("script");
  s.defer = true;
  s.src = "../_vercel/insights/script.js";

<body>
    <div id="sub">
        <a href="../" style="margin-left: 10px;"> <i class="fa-regular fa-face-smile"></i> The Hub</a>
        <a href="../sub-sites/games.html"><span><i class="fa-solid fa-gamepad" style="font-size: 30px;"></i> Games</span></a>
        <a href="../sub-sites/links.html"><i class="fa-solid fa-link"></i> Links</a>
        <a href="../sub-sites/media.html"><i class="fa-solid fa-tv"></i> Media</a>
        <a href="../sub-sites/settings.html"> <i class="fa-solid fa-gear"></i> Settings</a>
    </div>
    <br>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 20px; text-align: center;">
        <select id="sectionPicker" onchange="pick(this.value)" style="margin-bottom: 10px;padding: 10px;background-color: #5e7594;border-radius: 10px;">
            <option value="1" selected>Other Domains</option>
            <option value="2">Custom Links</option>
        </select>
        <div id="1" style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <h2>Links to other domains</h2>
            <br>
            <a href="https://happyrilla.github.io/The-Hub/" target="_blank" class="dashy">The Hub link 1</a>
            <a href="https://the-hubb.vercel.app/" target="_blank" class="dashy">The Hub link 2 (best)</a>
            <a href="https://the-hubb.netlify.app/" target="_blank" class="dashy">The Hub link 3 (most of the time dosent work)</a>
            <a href="https://the-hub-xt1t.onrender.com/" target="_blank" class="dashy">The Hub link 4</a>
        </div>
        <div id="2" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
            <h2>Custom Links</h2>
            <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;">
                <div id="customLinksList" style="display: flex; flex-direction: row; align-items: center; gap: 12px; flex-wrap: wrap;"></div>
                <div id="linko" onclick="addlink()"><a>Add Link</a></div>
            </div>
        </div>
        <dialog id="dialog">
            <form id="customLinkForm">
                <a>Add a Custom Link</a>
                <h5>Name</h5>
                <input id="customLinkName" type="text" required>
                <h5>Link</h5>
                <input id="customLinkUrl" type="text" required>
                <button type="submit">enter</button>
            </form>
        </dialog>
    </div>
</body>
</html>
