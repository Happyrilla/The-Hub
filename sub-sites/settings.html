<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Google</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../js/customizer.js" defer></script>
    <link rel="icon" type="image/png" href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" />
    <script src="https://kit.fontawesome.com/19b444568b.js" crossorigin="anonymous"></script>
    <script src="../js/panic.js" defer></script>
    <script src="../js/shortcut.js"></script>
    <script>
        if (!location.hostname.endsWith("github.io")) {
            var s = document.createElement("script");
            s.defer = true;
            s.src = "../_vercel/insights/script.js";
            document.head.appendChild(s);
        }
    </script>
    <style>
        #dialog {
            background-color: #5e7594;
            border-radius: 7%;
        }
        #dialogbtn {
            width: fit-content;
        }
        .things {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 5vh;
            gap: 5px;
            flex-direction: column;
        }

        .thing {
            transition: all 0.3s ease;
        }

        .thing:hover {
            transform: scale(1.2);
        }
    </style>
    <style>
        body {
            background-image: url('https://luchenator.dev/assets/backgrounds/backgroundindex.gif');
            background-color: rgba(76, 20, 2, 0.25);
            background-blend-mode: multiply;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div id="sub">
        <a href="../" style="margin-left: 10px;"> <i class="fa-regular fa-face-smile"></i> The Hub</a>
        <a href="../sub-sites/games.html"><span><i class="fa-solid fa-gamepad" style="font-size: 30px;"></i>
                Games</span></a>
        <a href="../sub-sites/links.html"><i class="fa-solid fa-link"></i> Links</a>
        <a href="../sub-sites/media.html"><i class="fa-solid fa-tv"></i> Media</a>
        <a href="../sub-sites/settings.html"> <i class="fa-solid fa-gear"></i> Settings</a>
    </div>
    <div class="thingys">
        <div class="thingy">
            <h2 style="margin-top: 20px;">Tab Customizer</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <input type="text" placeholder="Title" onkeyup="setTitle(this.value)" class="form">
                <input type="text" placeholder="Icon" onchange="setfavicon(this.value.trim())" class="form">
                <button style="margin-top: 30px;" type="button" id="dialogbtn">List of icons</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Media Chooser</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <button onclick="setmedia('null')">Normal Movies</button>
                <button onclick="setmedia('yes')">My Collection</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Panic System</h2>
            <form style="display: flex; flex-direction: column;">
                <input type="text" placeholder="button" onkeyup="setpanicbutton(this.value)" class="form">
                <input type="text" placeholder="link (remember https://)" onkeyup="setpaniclink(this.value)"
                    class="form">
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Shortcuts</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <button onclick="shortcut('true'); enableShortcuts()">Activate Shortcuts</button>
                <button onclick="shortcut('false')">Deactivate Shortcuts</button>
                <button style="margin-top: 30px;" type="button" id="dialogbtn">List of Shortcuts</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Help</h2>
            <form style="display: flex; flex-direction: column;">
                <a href="./settings/tab.html" class="form">Tab Customizer Help</a>
            </form>
        </div>
    </div>
    <dialog id="dialog">
        <form method="dialog">
            <div class="things">
                <h2 style="font-size: 2rem; top: 20%;">Click to copy the icon links</h2>
                <br>
                <img src="https://www.youtube.com/s/desktop/5af4fee3/img/favicon_144x144.png" alt="Youtube logo" height="60" width="60" onclick="clipboard('https://www.youtube.com/s/desktop/5af4fee3/img/favicon_144x144.png')">
                <img src="https://github.githubassets.com/favicons/favicon-dark.png" height="60" width="60" onclick="clipboard('https://github.githubassets.com/favicons/favicon-dark.png')" alt="github logo">
                <img src="https://archive.org/offshoot_assets/favicon.ico" height="60" width="60" onclick="clipboard('https://archive.org/offshoot_assets/favicon.ico')" alt="Archive.org logo">
            </div>
            <button id="closebtn" style="left: 32%;">Close</button>
        </form>
    </dialog>
    <dialog id="dialog2">
        <form method="dialog">
            <div class="things">
                <h2 style="font-size: 2rem; top: 20%;">Shortcut keys:</h2>
                <br>
                <a>Home Page: H</a>
                <a>Games Page: G</a>
                <a>Links Page: L</a>
                <a>Media Page: M</a>
                <a>Settings Page: S</a>
            </div>
            <button id="closebtn" style="left: 32%;">Close</button>
        </form>
    </dialog>
    <script>
        const dialogBtns = document.querySelectorAll('#dialogbtn');
        const dialog = document.getElementById('dialog');
        const dialog2 = document.getElementById('dialog2');
        const closeBtns = document.querySelectorAll('#closebtn');

        if (dialogBtns.length) {
            if (dialogBtns[0] && dialog) dialogBtns[0].addEventListener('click', () => dialog.showModal());
            if (dialogBtns[1] && dialog2) dialogBtns[1].addEventListener('click', () => dialog2.showModal());
        }

        closeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const dlg = e.target.closest('dialog');
                if (dlg) dlg.close();
            });
        });

        function clipboard(value) { navigator.clipboard.writeText(value); }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem("panicbutton")) localStorage.setItem("panicbutton", null);
            if (!localStorage.getItem("paniclink")) localStorage.setItem("paniclink", null);
        });
        function setmedia(value) { localStorage.setItem("media", value); }
        function setpanicbutton(value) { localStorage.setItem("panicbutton", value); }
        function setpaniclink(value) { localStorage.setItem("paniclink", value); }
        function setTitle(value) {
            document.title = value || "Google";
            localStorage.setItem("title", value);
        }
        function setfavicon(value) { const sm = value; document.querySelector("link[rel='icon']").href = sm; localStorage.setItem("favicon", sm) }
        function shortcut(value) {
            if (value === "true") {
                localStorage.setItem("shortcut?", "true");
            } else {
                localStorage.setItem("shortcut?", null);
        }}
    </script>
</body>

</html>
