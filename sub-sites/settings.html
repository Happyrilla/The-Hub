<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Google</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../js/blocks.js" defer></script>
    <script src="../js/customizer.js" defer></script>
    <link rel="icon" type="image/png" href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" />
    <script src="https://kit.fontawesome.com/19b444568b.js" crossorigin="anonymous"></script>
    <script src="../js/panic.js" defer></script>
    <script src="../js/shortcut.js"></script>
    <script>
        if (!location.hostname.endsWith("github.io")) {
            var s = document.createElement("script");
            s.defer = true;
            s.src = "../_vercel/insights/script.js";
            document.head.appendChild(s);
        }
    </script>
    <style>
        #dialog {
            background-color: #5e7594;
            border-radius: 7%;
        }
        #dialogbtn {
            width: fit-content;
        }
        .things {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 5vh;
            gap: 5px;
            flex-direction: column;
        }

        .thing {
            transition: all 0.3s ease;
        }

        .thing:hover {
            transform: scale(1.2);
        }

        .blocks-setting {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .blocks-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(100%, 220px);
            margin-top: 12px;
        }

        .blocks-options label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
    </style>
    <style>
        body {
            background-image: url('https://luchenator.dev/assets/backgrounds/backgroundindex.gif');
            background-color: rgba(76, 20, 2, 0.25);
            background-blend-mode: multiply;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div id="sub">
        <a href="../" style="margin-left: 10px;"> <i class="fa-regular fa-face-smile"></i> The Hub</a>
        <a href="../sub-sites/games.html"><span><i class="fa-solid fa-gamepad" style="font-size: 30px;"></i>
                Games</span></a>
        <a href="../sub-sites/links.html"><i class="fa-solid fa-link"></i> Links</a>
        <a href="../sub-sites/movies.html"><i class="fa-solid fa-tv"></i> Media</a>
        <a href="../sub-sites/settings.html"> <i class="fa-solid fa-gear"></i> Settings</a>
    </div>
    <div class="thingys">
        <div class="thingy">
            <h2 style="margin-top: 20px;">Tab Customizer</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <input type="text" placeholder="Title" onkeyup="setTitle(this.value)" class="form">
                <input type="text" placeholder="Icon" onchange="setfavicon(this.value.trim())" class="form">
                <button style="margin-top: 30px;" type="button" id="dialogbtn">List of icons</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Media Chooser</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <button onclick="setmedia('null')">Normal Movies</button>
                <button onclick="setmedia('yes')">My Collection</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Panic System</h2>
            <form style="display: flex; flex-direction: column;">
                <input type="text" placeholder="button" onkeyup="setpanicbutton(this.value)" class="form">
                <input type="text" placeholder="link (remember https://)" onkeyup="setpaniclink(this.value)"
                    class="form">
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Shortcuts</h2>
            <form onsubmit="return false;" style="display: flex; flex-direction: column;">
                <button onclick="shortcut('true'); enableShortcuts()">Activate Shortcuts</button>
                <button onclick="shortcut('false')">Deactivate Shortcuts</button>
                <button style="margin-top: 30px;" type="button" id="dialogbtn">List of Shortcuts</button>
            </form>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Background Blocks</h2>
            <label class="blocks-setting">
                <input type="checkbox" id="blocksToggle">
                Enable background effect
            </label>
            <div class="blocks-options">
                <label for="blocksCell">Cell size
                    <input class="form" type="number" id="blocksCell" min="4" max="64" step="1" aria-label="Cell size in pixels">
                </label>
                <label for="blocksReach">Reach
                    <input class="form" type="number" id="blocksReach" min="0.5" max="8" step="0.1" aria-label="Effect reach">
                </label>
            </div>
        </div>
        <div class="thingy">
            <h2 style="margin-top: 20px;">Help</h2>
            <form style="display: flex; flex-direction: column;">
                <a href="./settings/tab.html" class="form">Tab Customizer Help</a>
            </form>
        </div>
    </div>
    <dialog id="dialog">
        <form method="dialog">
            <div class="things">
                <h2 style="font-size: 2rem; top: 20%;">Click to copy the icon links</h2>
                <br>
                <img src="https://www.youtube.com/s/desktop/5af4fee3/img/favicon_144x144.png" alt="Youtube logo" height="60" width="60" onclick="clipboard('https://www.youtube.com/s/desktop/5af4fee3/img/favicon_144x144.png')">
                <img src="https://github.githubassets.com/favicons/favicon-dark.png" height="60" width="60" onclick="clipboard('https://github.githubassets.com/favicons/favicon-dark.png')" alt="github logo">
                <img src="https://archive.org/offshoot_assets/favicon.ico" height="60" width="60" onclick="clipboard('https://archive.org/offshoot_assets/favicon.ico')" alt="Archive.org logo">
            </div>
            <button id="closebtn" style="left: 32%;">Close</button>
        </form>
    </dialog>
    <dialog id="dialog2">
        <form method="dialog">
            <div class="things">
                <h2 style="font-size: 2rem; top: 20%;">Shortcut keys:</h2>
                <br>
                <a>Home Page: H</a>
                <a>Games Page: G</a>
                <a>Links Page: L</a>
                <a>Media Page: M</a>
                <a>Settings Page: S</a>
                <a>Dashboard: D</a>
            </div>
            <button id="closebtn" style="left: 32%;">Close</button>
        </form>
    </dialog>
    <script>
        const dialogBtns = document.querySelectorAll('#dialogbtn');
        const dialog = document.getElementById('dialog');
        const dialog2 = document.getElementById('dialog2');
        const closeBtns = document.querySelectorAll('#closebtn');

        if (dialogBtns.length) {
            if (dialogBtns[0] && dialog) dialogBtns[0].addEventListener('click', () => dialog.showModal());
            if (dialogBtns[1] && dialog2) dialogBtns[1].addEventListener('click', () => dialog2.showModal());
        }

        closeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const dlg = e.target.closest('dialog');
                if (dlg) dlg.close();
            });
        });

        function clipboard(value) { navigator.clipboard.writeText(value); }
    </script>
    <script>
        const blocksToggle = document.getElementById("blocksToggle");
        const blocksCell = document.getElementById("blocksCell");
        const blocksReach = document.getElementById("blocksReach");
        const blockOptions = [
            { input: blocksCell, key: "blocksCell", fallback: 16, min: 4, max: 64, step: 1, value: 16 },
            { input: blocksReach, key: "blocksReach", fallback: 2.5, min: 0.5, max: 8, step: 0.1, value: 2.5 }
        ];
        let blocksEnabled = false;

        try {
            blocksEnabled = localStorage.getItem("blocks") === "ok";
            blocksToggle.checked = blocksEnabled;
            blockOptions.forEach(function (option) {
                const saved = Number(localStorage.getItem(option.key));
                const valid = Number.isFinite(saved) &&
                    saved >= option.min &&
                    saved <= option.max &&
                    Math.abs((saved - option.min) / option.step - Math.round((saved - option.min) / option.step)) < 1e-8;
                option.value = valid ? saved : option.fallback;
                option.input.value = String(option.value);
            });
        } catch (error) {
            blocksToggle.disabled = true;
            blockOptions.forEach(function (option) {
                option.input.disabled = true;
                option.input.value = String(option.fallback);
            });
            console.warn("[Blocks] Could not read localStorage in settings.", error);
        }

        blocksToggle.addEventListener("change", function () {
            try {
                if (blocksToggle.checked) {
                    localStorage.setItem("blocks", "ok");
                } else {
                    localStorage.removeItem("blocks");
                }
                blocksEnabled = blocksToggle.checked;
            } catch (error) {
                blocksToggle.checked = blocksEnabled;
                console.warn("[Blocks] Could not save localStorage setting.", error);
            }
        });

        blockOptions.forEach(function (option) {
            option.input.addEventListener("change", function () {
                const value = Number(option.input.value);
                const valid = Number.isFinite(value) &&
                    value >= option.min &&
                    value <= option.max &&
                    Math.abs((value - option.min) / option.step - Math.round((value - option.min) / option.step)) < 1e-8;
                if (!valid) {
                    console.warn("[Blocks] Value must be between " + option.min + " and " + option.max + ".");
                    option.input.value = String(option.value);
                    return;
                }
                try {
                    localStorage.setItem(option.key, String(value));
                    option.value = value;
                } catch (error) {
                    console.warn("[Blocks] Could not save " + option.key + " to localStorage.", error);
                    option.input.value = String(option.value);
                }
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem("panicbutton")) localStorage.setItem("panicbutton", null);
            if (!localStorage.getItem("paniclink")) localStorage.setItem("paniclink", null);
        });
        function setmedia(value) { localStorage.setItem("media", value); }
        function setpanicbutton(value) { localStorage.setItem("panicbutton", value); }
        function setpaniclink(value) { localStorage.setItem("paniclink", value); }
        function setTitle(value) {
            document.title = value || "Google";
            localStorage.setItem("title", value);
        }
        function setfavicon(value) { const sm = value; document.querySelector("link[rel='icon']").href = sm; localStorage.setItem("favicon", sm) }
        function shortcut(value) {
            if (value === "true") {
                localStorage.setItem("shortcut?", "true");
            } else {
                localStorage.setItem("shortcut?", null);
        }}
    </script>
</body>

</html>
