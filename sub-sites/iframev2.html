<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iframer</title>
    <script src="../js/customizer.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/png" href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" />
    <script src="https://kit.fontawesome.com/19b444568b.js" crossorigin="anonymous"></script>
    <script src="../js/shortcut.js"></script>
    <script>
if (!location.hostname.endsWith("github.io")) {
  var s = document.createElement("script");
  s.defer = true;
  s.src = "../_vercel/insights/script.js";
  document.head.appendChild(s);
}
</script>
</head>
<body>
    <div id="sub">
        <a href="../" style="margin-left: 10px;"> <i class="fa-regular fa-face-smile"></i> The Hub</a>
        <a href="../sub-sites/games.html"><span><i class="fa-solid fa-gamepad" style="font-size: 30px;"></i>Games</span></a>
        <a href="../sub-sites/links.html"><i class="fa-solid fa-link"></i> Links</a>
        <a href="../sub-sites/media.html"><i class="fa-solid fa-tv"></i> Media</a>
        <a href="../sub-sites/settings.html"> <i class="fa-solid fa-gear"></i> Settings</a>
    </div>
    <div class="iframec">
        <iframe id="iframee" onclick="prox(this.value)"></iframe>
        <div class="underbar">
            <a id="expand" class="underbar-btn" onclick="" data-content="Fullscreen"><i class="fa-solid fa-expand"></i></a>
            <a class="underbar-btn" onclick="refresh()" data-content="Refresh"><i class="fa-solid fa-rotate"></i></a>
            <a class="underbar-btn" onclick="dialogy()" data-content="Custom Link"><i class="fa-solid fa-keyboard"></i></a>
            <a class="underbar-btn" onclick="prox()" style="margin-right: 58rem;" data-content="Proxy"><img src="../assets/interstellar.png"></a>
        </div>
    </div>
    <dialog id="dialog">
        <h1>Enter a custom link</h1>
        <input type="text" id="customlink" placeholder="https://example.com" oninput="updateLink()" />
        <button id="dialogbtn" onclick="dia.close()" style="margin-top: 20rem; margin-left: 20rem;">Close</button>
    </dialog>
    <script defer>
        const dia = document.getElementById("dialog");
        const params = new URLSearchParams(window.location.search);
        const app = params.get('app');
        const ifr = document.getElementById("iframee")
        const idd = document.querySelector("#customlink")
        ifr.addEventListener('load', () => {
            if (ifr.src) { idd.placeholder = ifr.src }
        })
        if (app) {
            ifr.src = app;
        }
        function refresh() {
            ifr.src = ifr.src;
        }
        document.querySelector('#expand').addEventListener('click', async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await ifr.requestFullscreen();
            }
        });

        document.querySelectorAll('.underbar-btn').forEach((btn) => {
            const originalHtml = btn.innerHTML;
            const label = btn.getAttribute('data-content');

            btn.addEventListener('mouseenter', () => {
                btn.innerHTML = label
                btn.style.fontSize = "0.6rem"
            });

            btn.addEventListener('mouseleave', () => {
                btn.innerHTML = originalHtml;
                btn.style.fontSize = "1rem"
            });
        });

        function dialogy() {
            dia.showModal();
        }
        function updateLink() {
            let link = document.getElementById("customlink").value;
            
            if (!link.startsWith("https://") && !link.startsWith("http://") && !link.startsWith(".")) {
                link = "https://" + link;
            }
            ifr.src = link;
        }
        function encodeUrlForSj(url) {
            const s = String(url);

             try {
                const b64 = btoa(unescape(encodeURIComponent(s)));
                return b64.replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
                } catch (e) {
                    return encodeURIComponent(s);
                }
            }
            function getPxyUrlForSj(url) {
                const encoded = encodeUrlForSj(url);
                return `https://interstellaryy.vercel.app/a/sj/${encoded}`;
            }
            function prox() {
                ifr.src = getPxyUrlForSj(ifr.src);
            }
    </script>
</body>
</html>
