<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iframer</title>
    <script src="../js/blocks.js" defer></script>
    <script src="../js/customizer.js"></script>
    <script src="../js/navigation.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/png" href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" />
    <script src="https://kit.fontawesome.com/19b444568b.js" crossorigin="anonymous"></script>
    <script src="../js/shortcut.js"></script>
    <script>
if (!location.hostname.endsWith("github.io")) {
  var s = document.createElement("script");
  s.defer = true;
  s.src = "../_vercel/insights/script.js";
  document.head.appendChild(s);
}
</script>
</head>
<body>
    <div class="iframec">
        <iframe id="iframee"></iframe>
        <div class="underbar">
            <a id="expand" class="underbar-btn" onclick="" data-content="Fullscreen"><i class="fa-solid fa-expand"></i></a>
            <a class="underbar-btn" onclick="refresh()" data-content="Refresh"><i class="fa-solid fa-rotate"></i></a>
            <a class="underbar-btn" onclick="dialogy()" data-content="Custom Link"><i class="fa-solid fa-keyboard"></i></a>
            <a class="underbar-btn" onclick="prox()" style="margin-right: 58rem;" data-content="Proxy"><img src="../assets/interstellar.png"></a>
        </div>
    </div>
    <dialog id="dialog">
        <h1>Enter a custom link</h1>
        <input type="text" id="customlink" placeholder="https://example.com" oninput="updateLink()" />
        <button id="dialogbtn" onclick="dia.close()" style="margin-top: 20rem; margin-left: 20rem;">Close</button>
    </dialog>
    <script defer>
        const dia = document.getElementById("dialog");
        const params = new URLSearchParams(window.location.search);
        const app = params.get('app');
        const ifr = document.getElementById("iframee")
        const idd = document.querySelector("#customlink")
        ifr.addEventListener('load', () => {
            if (ifr.src) { idd.placeholder = ifr.src }
        })
        if (app) {
            ifr.src = app;
        }
        function refresh() {
            ifr.src = ifr.src;
        }
        document.querySelector('#expand').addEventListener('click', async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await ifr.requestFullscreen();
            }
        });

        document.querySelectorAll('.underbar-btn').forEach((btn) => {
            const originalHtml = btn.innerHTML;
            const label = btn.getAttribute('data-content');

            btn.addEventListener('mouseenter', () => {
                btn.innerHTML = label
                btn.style.fontSize = "0.6rem"
            });

            btn.addEventListener('mouseleave', () => {
                btn.innerHTML = originalHtml;
                btn.style.fontSize = "1rem"
            });
        });

        function dialogy() {
            dia.showModal();
        }
        function updateLink() {
            let link = document.getElementById("customlink").value;
            
            if (!link.startsWith("https://") && !link.startsWith("http://") && !link.startsWith(".")) {
                link = "https://" + link;
            }
            ifr.src = link;
        }
    </script>
</body>
</html>
