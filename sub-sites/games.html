<!DOCTYPE html>
    <head>
        <meta charset="UTF-8" />

        <script src="../js/main.js" defer></script>

    <script>
if (!location.hostname.endsWith("github.io")) {
  var s = document.createElement("script");
  s.defer = true;
  s.src = "../_vercel/insights/script.js";
  document.head.appendChild(s);
}
</script>
    <script>
        function updateGameCountLabel() {
            const searchInput = document.getElementById("search");
            const gameCount = document.querySelectorAll("img.gamesy").length;

            if (searchInput) {
                searchInput.placeholder = "Search our " + gameCount + " games";
                searchInput.setAttribute("aria-label", "Search our (" + gameCount + " games)");
            }
        }

        document.addEventListener("DOMContentLoaded", updateGameCountLabel);
    </script>
    </head>
    <body>
            <div class="games">
                <div class="searchbar-wrapper">
                    <input type="text" placeholder="Search games..." id="search" class="searchbar" onkeyup="search(this.value)" />
                </div>
            </div>
            <div class="req">
                <button class="reqbtn" onclick="window.location.href='./gamesreq.html'">Request a Game</button>
            </div>
    </body>
